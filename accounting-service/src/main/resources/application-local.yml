spring:
  application:
    name: accounting-service
  profiles:
    active: local
  cloud:
    aws:
      region:
        static: us-east-1
      sqs:
        endpoint: http://localhost:4566
        region: us-east-1

server:
  port: 8083
  shutdown: graceful

logging:
  level:
    root: INFO
    com.pod99: DEBUG
    io.awspring.cloud.sqs: DEBUG

aws:
  region: us-east-1
  credentials:
    access-key-id: ${AWS_ACCESS_KEY_ID:test}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  dynamodb:
    endpoint: http://localhost:4566
  eventbridge:
    endpoint: http://localhost:4566
  sqs:
    endpoint: http://localhost:4566

app:
  rate-limit:
    enabled: true
    tps: 5
    table-name: pod99-rate-limit
